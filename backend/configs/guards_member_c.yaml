# member_c 가드 프로필 — 시작점은 default 와 같고, 예시 플러그인 가드(member_c.keyword_block)가 추가되어 있다.
# 자신의 가드를 app/guardrails/members/member_c/guards.py 에 만들고 아래 목록을 자유롭게 바꾼다.
name: member_c
description: member_c 의 가드 구성 (초기값 = default + 예시 키워드 가드)

input:
  - guard: input_rule
  - guard: member_c.keyword_block
    params:
      category: harmful_sensitive
      keywords: []          # 예: ["폭탄", "해킹"] — 각자 설계에 맞게 채운다
  - guard: input_llm
    params:
      block_categories: [out_of_scope, harmful_sensitive, jailbreak, disguised_attack]
      min_score: 0.5

output:
  - guard: citation
  - guard: groundedness
    params:
      max_unsupported: 0
  - guard: output_safety

policy:
  max_regenerations: 1
