# 기본 가드 프로필 (default guard profile)
# 같은 단계 안에서는 규칙(rule) 가드가 LLM 가드보다 먼저 실행된다 (settings.yaml guards.enforce_rule_first).
# on_error: 가드 내부 오류 시 동작 (allow | block). 생략하면 settings.yaml 의 guards.default_on_error.
name: default
description: 기본 가드 — 규칙 기반 입력 검사 → LLM 입력 분류 → 출처 검사 → 근거 충실도 → 출력 안전

input:
  - guard: input_rule
  - guard: input_llm
    params:
      block_categories: [out_of_scope, harmful_sensitive, jailbreak, disguised_attack]
      min_score: 0.5

output:
  - guard: citation
    params:
      min_citations: 1
      allow_not_found_without_citation: true
  - guard: groundedness
    params:
      max_unsupported: 0
  - guard: output_safety
    params:
      min_score: 0.5

policy:
  max_regenerations: 1   # 출력 revise 시 재생성 최대 횟수
