# 비밀이 아닌 튜닝값 (non-secret tunables). 비밀값(API key)은 backend/.env 에만 둔다.
# 일부 값은 환경변수로 덮어쓸 수 있다: LLM_TIMEOUT_SECONDS, LLM_MAX_RETRIES, KB_DIR, KB_INDEX_PATH,
# RETRIEVAL_TOP_K, HYBRID_SEARCH

llm:
  generator:            # 답변 생성 (tutor answer)
    temperature: 0.3
    max_tokens: 2000    # Elice non-streaming ceiling
  judge:                # 가드레일 판정 — temperature 0 고정 (모델이 지원하지 않으면 생략되고 로그에 기록됨)
    temperature: 0.0
    max_tokens: 2000
  rewriter:             # 질의 재작성 (judge 제공자 사용)
    temperature: 0.0
    max_tokens: 512
  timeout_seconds: 60
  max_retries: 2        # 429 / 5xx / 타임아웃 / 연결 오류 재시도 횟수 (exponential backoff)
  retry_base_delay: 1.0
  retry_max_delay: 16.0

# 예상 비용 계산용 가격표 (USD per 1M tokens). 가격은 바뀔 수 있으니 공식 가격표로 갱신한다.
# 목록에 없는 모델은 비용 0 으로 표시된다 (unknown).
pricing_usd_per_mtok:
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-4-6: {input: 3.00, output: 15.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}

kb:
  dir: data/sample/kb               # 교육 자료 폴더 (.md .txt .json, pdf 는 선택)
  index_path: data/index/kb_index.json
  chunk_size: 600                   # 청크 최대 글자 수 (characters)
  chunk_overlap: 100                # 긴 섹션을 나눌 때 앞 청크 끝부분을 겹치는 글자 수
  auto_build: true                  # 서버 시작 시 인덱스 파일이 없으면 자동 생성

retrieval:
  top_k: 4
  min_score: 0.25        # BM25 정규화 점수(0~1) 임계값 (kiwi 토크나이저). 미달이면 "근거 없음"
  min_score_simple: 0.20 # fallback(simple) 토크나이저일 때의 임계값
  tokenizer: auto        # auto(kiwi 있으면 kiwi) | kiwi | simple(공백+문자 bigram)
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60              # 하이브리드 RRF 상수
  dense:
    enabled: false       # true 로 켜면 BM25 + dense 를 RRF 로 결합 (sentence-transformers 필요)
    model: intfloat/multilingual-e5-small
    min_score: 0.80      # dense 코사인 유사도 임계값 (BM25 임계값과 OR 조건)
    cache: true

query_rewrite:
  policy: auto           # auto(짧거나 지시어로 시작하는 후속 질문만) | always | never
  max_short_chars: 20
  history_turns: 3

guards:
  default_on_error: block   # 가드 내부 오류 시 기본 동작 (allow = fail-open, block = fail-closed)
  history_turns: 3          # 판정 프롬프트에 넣을 최근 대화 턴 수
  enforce_rule_first: true  # 같은 단계에서 규칙 가드를 LLM 가드보다 먼저 실행
