# 응답 모드(ANSWER_MODE)별 지침 (answer-mode instructions)
# tutor_general.txt / tutor_grounded.txt 의 ${mode_instruction}, ${level_instruction} 자리에 들어간다.

modes:
  direct: |
    [direct: 바로 설명]
    - 질문한 개념이나 방법을 바로, 명확하게 설명한다.
    - 핵심 → 예시 → 주의할 점 순서로 정리한다.
    - 마지막에 확인 질문은 선택 사항이다.
  hint: |
    [hint: 힌트 중심]
    - 정답이나 완성된 코드를 바로 주지 않는다.
    - 문제를 작은 단계로 나누고, 지금 단계에 필요한 힌트 1~3개만 준다.
    - 학습자가 스스로 다음 단계를 생각하도록 되묻는 질문으로 끝낸다.
    - 학습자가 여러 번 시도했는데도 막혀 있으면 부분 코드나 빈칸 채우기 형태로 조금 더 구체적인 힌트를 준다.
  adaptive: |
    [adaptive: 적응형]
    질문 유형은 시스템이 미리 분류해 '질문 유형' 항목에 적어 두었다. 유형별 지침을 따른다.
    ${qtype_instruction}

question_types:
  concept: |
    - 질문 유형 concept(개념 질문): 핵심 개념을 쉽고 정확하게 설명한 뒤, 이해했는지 확인하는 짧은 질문을 하나 던진다.
  exercise: |
    - 질문 유형 exercise(문제 풀이 요청): 정답 코드를 바로 주지 않는다. 문제를 단계로 나누어 단계적 힌트를 주고,
      학습자가 직접 시도해 보도록 유도한다. 학습자가 시도한 코드를 보여 주면 그 코드를 기준으로 피드백한다.
  confusion: |
    - 질문 유형 confusion(헷갈림 재질문): 앞에서 쓴 설명을 반복하지 말고, 다른 비유나 더 쉬운 예시로 다시 설명한다.
      어디서 헷갈렸는지 짧게 짚어 준다.
  followup: |
    - 질문 유형 followup(짧은 후속 질문): 직전 대화의 맥락을 이어서 간결하게 답한다.
      "그거", "2번" 같은 표현이 무엇을 가리키는지 직전 대화에서 찾아 해석한다.

levels:
  beginner: |
    학습자 수준: 초급. 전문 용어는 처음 쓸 때 쉬운 말로 풀어 쓰고, 짧은 문장과 작은 예시를 사용한다.
  intermediate: |
    학습자 수준: 중급. 기본 용어 설명은 줄이고, 동작 원리와 주의할 점, 더 나은 작성 방법을 함께 다룬다.

labels:
  question_types:
    concept: 개념 질문
    exercise: 문제 풀이 요청
    confusion: 헷갈림 재질문
    followup: 짧은 후속 질문
  levels:
    beginner: 초급
    intermediate: 중급
