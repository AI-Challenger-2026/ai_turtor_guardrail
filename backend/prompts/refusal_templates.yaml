# 거절·대체 답변 템플릿 (refusal / fallback templates)
# 치환 변수 (variables): ${topics} = 교육 자료 단원 목록, ${reason} = 짧은 사유
# 원칙: 왜 도와줄 수 없는지 짧게 말하고, 학습 주제로 부드럽게 유도한다. 훈계하지 않는다.

refusals:
  default: |
    이 요청은 학습 도우미가 도와드릴 수 있는 범위를 벗어나서 답하기 어려워요.
    대신 지금 배우고 있는 내용으로 돌아가 볼까요? 예를 들어 ${topics} 중에서 궁금한 걸 물어봐 주세요.
  out_of_scope: |
    이 질문은 지금 함께 공부하는 학습 범위 밖이라서 답하기 어려워요.
    저는 ${topics} 같은 주제를 도와드릴 수 있어요. 이 중에서 궁금한 걸 물어봐 줄래요?
  harmful_sensitive: |
    이 요청은 안전하지 않거나 민감한 내용이라 도와드릴 수 없어요.
    대신 ${topics} 같은 학습 주제라면 언제든 함께 볼 수 있어요.
    혹시 힘든 일이 있다면 혼자 고민하지 말고 보호자, 선생님, 또는 상담 기관(예: 청소년상담 1388)에 꼭 이야기해 주세요.
  jailbreak: |
    저는 학습 도우미로서 정해진 역할과 규칙을 바꾸거나 내부 설정을 공개할 수 없어요.
    대신 ${topics} 중에서 공부하고 싶은 내용을 물어봐 주세요.
  disguised_attack: |
    코딩 문제나 예제 형식이어도, 안전하지 않거나 학습 범위를 벗어난 내용은 도와드릴 수 없어요.
    ${topics} 범위의 실제 연습 문제라면 기꺼이 힌트를 드릴게요.
  pii: |
    대화에 주민등록번호, 전화번호, 카드번호 같은 개인정보가 포함된 것 같아요. 개인정보는 입력하지 말아 주세요.
    개인정보를 지우고 다시 질문해 주면 도와드릴게요.
  model_refusal: |
    이 요청에는 답변을 드리기 어려워요.
    ${topics} 같은 학습 주제라면 언제든 도와드릴게요.

fallbacks:
  unsupported: |
    교육 자료에서 충분한 근거를 확인한 답변을 만들지 못했어요. 정확하지 않은 내용을 전하지 않기 위해 답변을 보류할게요.
    질문을 조금 더 구체적으로 바꾸거나, ${topics} 중 관련 단원을 지정해서 다시 물어봐 주세요.
  unsafe: |
    생성된 답변이 학습자에게 적절하지 않을 수 있어 보여 드리지 않을게요.
    ${topics} 같은 학습 주제로 다시 질문해 주세요.
  guard_error: |
    안전 검사를 완료하지 못해 이번 답변은 보여 드리지 않을게요. 잠시 후 다시 시도해 주세요.

no_evidence: |
  제공된 학습 자료에서 이 질문에 대한 내용을 찾을 수 없어요. 자료에 없는 내용을 추측해서 알려 드리지 않을게요.
  대신 자료에서 다루는 ${topics} 중에서 관련된 주제를 물어봐 주면 자세히 설명해 드릴게요.
